spring:
  application:
    name: connect-ai
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/connect}
    username: ${DB_USERNAME:connect}
    password: ${DB_PASSWORD:connect}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8080
  error:
    include-message: always
  servlet:
    context-path: /connect-ai

connectai:
  cors:
    allowed-origins: ${CONNECTAI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    encryption-key: ${CONNECTAI_ENCRYPTION_KEY:}
  oauth:
    # Must equal the "Authorization callback URL" of each OAuth app you register.
    redirect-uri: ${CONNECTAI_OAUTH_REDIRECT_URI:http://localhost:8080/connect-ai/api/oauth/callback}
    # Exact origin of the browser app; OAuth callback messages are sent only to this origin.
    frontend-origin: ${CONNECTAI_FRONTEND_ORIGIN:http://localhost:5173}
    providers:
      github:
        display-name: GitHub
        authorize-url: https://github.com/login/oauth/authorize
        token-url: https://github.com/login/oauth/access_token
        client-id: ${GITHUB_OAUTH_CLIENT_ID:}
        client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
        # OAuth apps only offer coarse scopes; investigations still only use read-only tools.
        scopes: ${GITHUB_OAUTH_SCOPES:repo read:org read:user}
        pkce: true
      google:
        display-name: Google Drive
        authorize-url: https://accounts.google.com/o/oauth2/v2/auth
        token-url: https://oauth2.googleapis.com/token
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        scopes: https://www.googleapis.com/auth/drive.readonly
        access-type: offline
        revocation-url: https://oauth2.googleapis.com/revoke
        pkce: true
      slack:
        display-name: Slack
        authorize-url: https://slack.com/oauth/v2_user/authorize
        token-url: https://slack.com/api/oauth.v2.user.access
        client-id: ${SLACK_OAUTH_CLIENT_ID:}
        client-secret: ${SLACK_OAUTH_CLIENT_SECRET:}
        # Read-only user access for message search and channel/thread reads; comma-delimited per Slack OAuth.
        scopes: ${SLACK_OAUTH_SCOPES:search:read.public,search:read.private,channels:history,groups:history}
        redirect-uri: ${SLACK_OAUTH_REDIRECT_URI:}
        require-https-redirect: true
        expected-token-type: user
        resource: https://mcp.slack.com
        client-authentication: client_secret_post
        pkce: true
      grafana:
        display-name: Grafana Cloud
        # Grafana generates these values when an administrator registers Connect AI as an OAuth client.
        authorize-url: ${GRAFANA_OAUTH_AUTHORIZE_URL:}
        token-url: ${GRAFANA_OAUTH_TOKEN_URL:}
        client-id: ${GRAFANA_OAUTH_CLIENT_ID:}
        client-secret: ${GRAFANA_OAUTH_CLIENT_SECRET:}
        scopes: ${GRAFANA_OAUTH_SCOPES:}
        # Must exactly match a Redirect URL registered in Grafana; blank uses CONNECTAI_OAUTH_REDIRECT_URI.
        redirect-uri: ${GRAFANA_OAUTH_REDIRECT_URI:}
        client-authentication: ${GRAFANA_OAUTH_CLIENT_AUTHENTICATION:client_secret_basic}
        pkce: true
  mcp:
    request-timeout-seconds: ${CONNECTAI_MCP_REQUEST_TIMEOUT_SECONDS:20}
    connect-timeout-seconds: ${CONNECTAI_MCP_CONNECT_TIMEOUT_SECONDS:10}
    allow-private-hosts: ${CONNECTAI_MCP_ALLOW_PRIVATE_HOSTS:false}
  seed-demo-data: ${CONNECTAI_SEED_DEMO_DATA:false}
  tools:
    mode: ${CONNECTAI_TOOLS_MODE:mcp}
  llm:
    enabled: ${CONNECTAI_LLM_ENABLED:false}
    provider: ${CONNECTAI_LLM_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:qwen3:1.7b}
    model: claude-haiku-4-5-20251001
    # Output-token cap per model call (Anthropic max_tokens / Ollama num_predict).
    max-tokens: 1024
    timeout-seconds: ${CONNECTAI_LLM_TIMEOUT_SECONDS:30}
    # Ollama context window. Ollama's own default is small and silently truncates prompts.
    ollama-num-ctx: ${OLLAMA_NUM_CTX:8192}
    temperature: 0
  agent:
    semantic:
      # Optional; enable only after PostgreSQL has the pgvector extension and Ollama has the embedding model.
      enabled: ${CONNECTAI_SEMANTIC_RETRIEVAL_ENABLED:false}
      ollama-base-url: ${CONNECTAI_EMBEDDING_OLLAMA_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      embedding-model: ${CONNECTAI_EMBEDDING_MODEL:nomic-embed-text}
      timeout-seconds: ${CONNECTAI_EMBEDDING_TIMEOUT_SECONDS:10}
      # pgvector cosine distance is lower for closer matches (0 = identical, 1 = orthogonal).
      # Results farther than this are omitted so weak nearest neighbors cannot bypass topic gating.
      max-cosine-distance: ${CONNECTAI_SEMANTIC_MAX_COSINE_DISTANCE:0.6}
    fast-path:
      # Answer recognised questions with a fixed recipe and template (no model call).
      enabled: ${CONNECTAI_FAST_PATH_ENABLED:true}
    # Hard budgets for one investigation.
    max-steps: 6
    max-duration-seconds: 600
    # Consecutive failed tool calls tolerated before the run is FAILED.
    max-consecutive-failures: 2
    planner:
      # How many of the live catalog's tools the model is shown per decision.
      shortlist-size: 6
      # Model calls per decision, including repair retries for invalid replies.
      max-attempts: 3
  investigations:
    # Run investigations in the background (the UI polls); false runs them inline.
    async: true
    concurrency: 2
    queue-capacity: 20
logging:
  pattern:
    level: "%5p [inv:%X{investigationId:-}]"
