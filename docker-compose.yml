# Local PostgreSQL for the backend (see server/src/main/resources/application.yml).
# Start: docker compose up -d      Stop: docker compose down
# If port 5432 is already taken by another PostgreSQL, publish on another port:
#   CONNECTAI_PG_PORT=5433 docker compose up -d
# and start the backend with DB_URL=jdbc:postgresql://localhost:5433/connect
# The image is PostgreSQL with the pgvector extension pre-installed (needed in Phase 3).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: connectai-postgres
    environment:
      POSTGRES_DB: connect
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect
    ports:
      - "${CONNECTAI_PG_PORT:-5432}:5432"
    volumes:
      - connectai-pgdata:/var/lib/postgresql/data

volumes:
  connectai-pgdata:
