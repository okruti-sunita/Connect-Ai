spring:
  application:
    name: connect-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/connect}
    username: connect
    password: connect
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8080
  error:
    include-message: always

connectai:
  security:
    encryption-key: ${CONNECTAI_ENCRYPTION_KEY:local-dev-only-change-me}
  seed-demo-data: true
  tools:
    mode: fake
  llm:
    enabled: false
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-haiku-4-5-20251001
    max-tokens: 1024
    timeout-seconds: 30
