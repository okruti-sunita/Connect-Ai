databaseChangeLog:
  - changeSet:
      id: 001-create-investigation
      author: connect-ai
      changes:
        - createTable:
            tableName: investigation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: question
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: resolved_answer
                  type: VARCHAR(8000)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-evidence-item
      author: connect-ai
      changes:
        - createTable:
            tableName: evidence_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: investigation_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: source_ref
                  type: VARCHAR(300)
                  constraints:
                    nullable: false
              - column:
                  name: summary
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: confidence_score
                  type: DOUBLE
              - column:
                  name: fetched_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: evidence_item
            baseColumnNames: investigation_id
            referencedTableName: investigation
            referencedColumnNames: id
            constraintName: fk_evidence_investigation
            onDelete: CASCADE
        - createIndex:
            tableName: evidence_item
            indexName: idx_evidence_investigation_id
            columns:
              - column:
                  name: investigation_id

  - changeSet:
      id: 003-create-mcp-server
      author: connect-ai
      changes:
        - createTable:
            tableName: mcp_server
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: transport
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: endpoint
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: auth_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: encrypted_secret
                  type: VARCHAR(4096)
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: VARCHAR(1000)
              - column:
                  name: last_connected_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: mcp_server
            indexName: idx_mcp_server_enabled
            columns:
              - column:
                  name: enabled
